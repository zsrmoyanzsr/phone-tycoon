function investWear(G,id,tier){
  if(!G.techDone['sw_iot'])return{ok:false,err:'需先研发「跨设备互联」'};
  const w=WEAR_TYPES.find(x=>x.id===id);if(!w)return{ok:false,err:'无此品类'};
  if(w.unlock&&!w.unlock(G))return{ok:false,err:w.hint||'尚未解锁'};
  tier=clamp(Math.round(Number(tier)||1),1,3);
  const costMul=tier===3?1.3:tier===2?1.15:1;
  const fee=Math.round(w.invest*costMul*(G.wear[id]?0.6:1)); // 改款六折
  if(G.cash<fee)return{ok:false,err:'资金不足（'+fmtMoney(fee)+'）'};
  G.cash-=fee;
  const isNew=!G.wear[id];
  G.wear[id]={tier,price:w.sug[tier-1],cost:w.cost[tier-1],sales:0,cum:0};
  news(G,'⌚ '+(isNew?'发布':'改款')+' '+w.name+'（'+['入门','主流','高端'][tier-1]+'档，定价 '+fmtMoney(w.sug[tier-1])+'），开模投入 '+fmtMoney(fee)+'。','good');
  return{ok:true};
}
function setWearPrice(G,id,price){
  const w=WEAR_TYPES.find(x=>x.id===id);const p=G.wear&&G.wear[id];
  if(!w||!p)return{ok:false,err:'先发布产品'};
  price=Math.round(Number(price));
  if(!isFinite(price)||price<p.cost*1.1)return{ok:false,err:'定价需覆盖成本（至少 '+fmtMoney(p.cost*1.1)+'）'};
  p.price=price;return{ok:true};
}
function wearMonthly(G){
  if(!G.wear)G.wear={watch:null,buds:null};
  let profit=0;
  for(const w of WEAR_TYPES){
    const p=G.wear[w.id];if(!p)continue;
    const attach=Math.min(w.cap,w.attach*(p.tier===3?1.25:p.tier===2?1.1:1));
    const pf=clamp(Math.pow(w.sug[p.tier-1]/p.price,0.8),0.5,1.5); // 定价弹性
    p.sales=G.users*attach*pf;
    const pr=p.sales*(p.price-p.cost);
    p.cum+=pr;profit+=pr;
  }
  return profit;
}

  const cap=STAFF_CAPS[key]||1;

  return Math.min(cap,v);
}

  G.cash-=cost;
  if(!G.pity)G.pity={legend:0,rare:0};
  const res={legend:[],elite:0,normal:0};
  for(let i=0;i<n;i++){
    G.pity.legend++;G.pity.rare++;
    let rarity;
    if(G.pity.legend>=PITY_LEGEND){rarity=2;G.pity.legend=0;G.pity.rare=0;}
    else if(G.pity.rare>=PITY_RARE){rarity=Math.random()<0.2?2:1;G.pity.rare=0;if(rarity===2)G.pity.legend=0;}
    else{const r=Math.random();rarity=r<0.05?2:(r<0.30?1:0);if(rarity===2)G.pity.legend=0;if(rarity>=1)G.pity.rare=0;}
    const pool=TALENT_POOL.filter(t=>t.rarity===rarity);
    const t=pick(pool);
    G.staff.push({key:t.key,name:t.name,val:t.val,rarity});
    if(rarity===2)res.legend.push(t.name);else if(rarity===1)res.elite++;else res.normal++;
  }
  return{ok:true,res,cost};
}

/* ---------- 自动化运营 ---------- */
function autoOps(G){
  if(!G.auto)G.auto={prod:true,mkt:true,renew:true};
  const sales=G.models.filter(m=>m.status==='sale');
  if(G.auto.prod){
    // 自动排产：上月销量×1.1+缓冲；库存积压则停产清库存；总量受产能约束
    let want=0;const plans=sales.map(m=>{
      const last=Math.max(0,m.lastSales||0);
      const inv=Math.max(0,m.inv||0);
      let q=(inv>Math.max(last*BAL.autoProdInvK,BAL.autoProdInvMin))?0:Math.ceil(last*BAL.autoProdK)+BAL.autoProdBuf; // 库存超安全铺货线则停产清库存
      want+=q;return {m,q};
    });
    if(want>G.capacity){const k=G.capacity/want;plans.forEach(p=>p.q=Math.floor(p.q*k));}
    plans.forEach(p=>{p.m.prodPlan=p.q;});
  }
  if(G.auto.mkt){
    sales.forEach(m=>{
      const lastRev=m.lastRev||0;
      m.mkt=clamp(Math.round(lastRev*BAL.autoMktR/1e4)*1e4||BAL.autoMktMin,BAL.autoMktMin,BAL.autoMktMax);
    });
  }
  if(G.auto.research){ // 自动研发：最便宜可用优先，保留 2 亿缓冲
    const avail=[...TECHS,...SW_TECHS].filter(t=>techStatus(G,t)==='ok'&&!G.techRun.some(r=>r.id===t.id));
    avail.sort((a,b)=>a.cost-b.cost);
    for(const t of avail){
      if(G.techRun.length>=G.rndSlots)break;
      if(G.cash>t.cost*1e4+2e8)startTech(G,t.id);
    }
  }
  if(G.auto.gen){ // 自动换代：主力机龄>18 个月且无在研时自动立项，完成后自动发布
    for(const mo of G.models.filter(m=>m.status==='ready')){
      if(G.cash>3e8)launchModel(G,mo.id,Math.max(499,Math.round(unitCostOf(mo)*1.55/100)*100));
    }
    const act=activeModels(G);
    const lastLaunch=act.length?Math.max(...act.map(m=>m.launchMi||0)):-999;
    if(act.length<6&&G.mi-lastLaunch>=18&&!G.models.some(m=>m.status==='dev'||m.status==='ready')&&G.cash>5e8){
      const spec={};for(const cat of CAT_KEYS){let best=0;for(let i=0;i<CATS[cat].tiers.length;i++)if(tierAvail(G,cat,i))best=i;spec[cat]=best;}
      const feats=FEATS.filter(f=>featAvail(G,f)).sort((a,b)=>b.score-a.score).slice(0,2).map(f=>f.id);
      const r=startDev(G,spec,feats,'自动机型 '+G.year);
      if(r.ok)news(G,'🤖 自动化换代：「'+r.mo.name+'」已立项（旗舰档满配策略）。');
    }
  }
  if(G.auto.expand){ // 自动扩建：现金充裕且上月产能利用率 >92%
    const lastSales=G.models.reduce((a,m)=>a+(m.lastSales||0),0);
    if(G.cash>1.2e9+CAPACITY_UPS[0].cost&&lastSales>G.capacity*0.92){
      const idx=G.capBought<CAPACITY_UPS.length?Math.min(G.capBought,CAPACITY_UPS.length-1):0;
      buyCapacity(G,Math.min(idx,CAPACITY_UPS.length-1));
    }
  }
  // 联名到期处理：自动续约（现金不足则终止）
  if(G.camPartner&&G.mi>=G.camPartner.untilMi){
    const b=CAM_BRANDS.find(x=>x.id===G.camPartner.id);
    if(b){
      const years=G.camPartner.years||3;
      const fee=Math.round(b.fee*years*(years>=10?0.88:years>=5?0.95:1));
      if(G.auto.renew&&G.cash>=fee){
        G.cash-=fee;
        G.camPartner.untilMi=G.mi+12*years;
        news(G,'📷 '+b.name+' 影像联名自动续约 '+years+' 年（'+fmtMoney(fee)+'），合作继续。');
      }else{
        G.camPartner=null;
        news(G,'与 '+b.name+' 的影像联名到期结束'+(G.auto.renew?'（现金不足自动续约）。':'（自动续约未开启）。'));
      }
    }else G.camPartner=null;
  }
}

  let c=BAL.asmCost;
  for(const cat of CAT_KEYS)c+=effCost(G,cat,spec[cat]);
  for(const id of feats){const f=featObj(id);if(f)c+=f.cost*Math.pow(BAL.costDecay,G.year-f.year);}
  return c;
}
function complexityOf(spec,feats,hiddenCnt){
  let cx=0;
  for(const cat of CAT_KEYS)cx+=(spec[cat]+1)/CATS[cat].tiers.length*0.5;
  cx+=feats.length*0.12+hiddenCnt*0.35;
  return cx;
}
function yield0Of(G,spec,feats){
  const hid=feats.filter(id=>{const f=featObj(id);return f&&f.hidden;}).length;
  let y=clamp(0.92-complexityOf(spec,feats,hid)*0.30,0.50,0.94);
  if(subPerk(G,'bal'))y=clamp(y+0.03,0,0.97); // 精密制造体系
  y=clamp(y+staffBonus(G,'yield'),0,0.97);     // 良率型人才
  return y;
}
function unitCostOf(mo){return mo.bom/mo.yield_;}
/* ---------- 评算法（相对当年行业期望，借鉴 GDT 目标分机制）---------- */
const REV_PTS=[[0.4,1],[0.7,4],[0.85,5.5],[1.0,7.2],[1.1,8.3],[1.25,9.3],[1.45,10]];
function ratioTo10(r){
  if(r<=REV_PTS[0][0])return 1;
  for(let i=1;i<REV_PTS.length;i++){
    if(r<=REV_PTS[i][0]){const[a,va]=REV_PTS[i-1],[b,vb]=REV_PTS[i];return va+(r-a)/(b-a)*(vb-va);}
  }
  return 10;
}
function hiddenCntOf(spec,feats){
  let n=0;
  for(const cat of CAT_KEYS){const t=CATS[cat].tiers[spec[cat]];if(t&&t.hidden)n++;}
  for(const id of feats){const f=featObj(id);if(f&&f.hidden)n++;}
  return n;
}
function G_hasTech(G,id){return !!(G.techDone[id]);}
/* ---------- 归段：价格段 × 配置段（配置堆料会被归入它所属的高段位）---------- */
function configSegOf(G,hw){
  let best=null;
  for(const s of SEGS){
    const e=expectation(s,G.year);
    if(hw>=e*1.12&&hw<=e*1.75)best=s; // 配置落在该段的典型带宽内才算"这段的机"
  }
  return best;
}
function phoneSeg(G,mo){
  const ps=segOfPrice(mo.price,G.year);
  if(mo.aiSeg)return ps; // AI 机型用设计时的段
  const cs=configSegOf(G,hwScoreOf(G,mo.spec,mo.feats,ps));
  if(!cs)return ps;
  return SEGS.indexOf(cs)>SEGS.indexOf(ps)?cs:ps; // 取更高者：堆料机按配置归段
}
function computeReview(G,mo,aiMeds){
  const seg=phoneSeg(G,mo);
  const total=totalScoreOf(G,mo.spec,mo.feats,seg);
  const exp=expectation(seg,G.year)*BAL.hwSwSplit[0]+swAI(G.year)*BAL.hwSwSplit[1];
  let base=ratioTo10(total/exp);
  const val=total/Math.pow(mo.price,seg.pExp||0.62);
  const med=aiMeds&&aiMeds.length?aiMeds[Math.floor(aiMeds.length/2)]:val;
  const adj=clamp((val/med-1)*3,-1.5,1.5);
  const nov=hiddenCntOf(mo.spec,mo.feats)*0.35+(CATS.screen.tiers[mo.spec.screen].fold?0.4:0);
  const r=clamp(base+adj+nov+staffBonus(G,'review')+rnd(-0.3,0.3),1,10); // 媒体缘人才
  return Math.round(r*10)/10;
}
/* ---------- 玩家操作 ---------- */
function activeModels(G){return G.models.filter(m=>m.status!=='dead');}
function startTech(G,id){
  const t=techById(id);if(!t)return{ok:false,err:'无此科技'};
  if(G.techDone[id])return{ok:false,err:'已研发'};
  if(G.techRun.some(r=>r.id===id))return{ok:false,err:'进行中'};
  if(G.techRun.length>=G.rndSlots)return{ok:false,err:'研发室已满'};
  const st=techStatus(G,t);if(st!=='ok')return{ok:false,err:'条件未满足'};
  if(G.cash<t.cost*1e4)return{ok:false,err:'资金不足'};
  G.cash-=t.cost*1e4;G.cumRnd+=t.cost*1e4;
  G.techRun.push({id,left:t.months,total:t.months});
  return{ok:true};
}
function techStatus(G,t){
  if(G.techDone[t.id])return'done';
  if(G.techRun.some(r=>r.id===t.id))return'run';
  if(t.hidden&&!G.revealedH.includes(t.hid))return'mystery';
  if(G.year<t.minYear)return'year';
  if(t.req){
    const reqs=Array.isArray(t.req)?t.req:[t.req];
    if(reqs.some(r=>!G.techDone[r]))return'req';
  }
  return'ok';
}
function startDev(G,spec,feats,name){
  if(activeModels(G).length>=6)return{ok:false,err:'产品线已满（最多 6 款）'};
  for(const cat of CAT_KEYS)if(!tierAvail(G,cat,spec[cat]))return{ok:false,err:'配置含未解锁部件'};
  for(const id of feats)if(!featAvail(G,featObj(id)))return{ok:false,err:'含未解锁功能'};
  const bom=bomOf(G,spec,feats);

  G.cash-=nre;
  const mo={id:newId(),name:name||('机型 '+G.models.length),spec,feats,bom,
    yield_:yield0Of(G,spec,feats),status:'dev',devLeft:3,

    reviews:[],lastSales:0,lastRev:0,totalSales:0,cumProfit:0,hypeUntil:0};
  G.models.push(mo);
  return{ok:true,mo};
}
function launchModel(G,id,price){
  const mo=G.models.find(m=>m.id===id);if(!mo||mo.status!=='ready')return{ok:false,err:'状态不对'};
  price=Math.round(Number(price));
  if(!isFinite(price)||price<300)return{ok:false,err:'定价至少 300 元'};

  yearBestCand(G,{mi:G.mi,name:mo.name,ratio10:r,isPlayer:true,aiName:null});
  news(G,'「'+mo.name+'」正式发布：'+fmtMoney(price)+'，媒体评分 '+r.toFixed(1)+'。'+quoteFor(r)[1],'good');
  return{ok:true,review:r};
}
function setPrice(G,id,price){const mo=G.models.find(m=>m.id===id);if(!mo||mo.status!=='sale')return{ok:false};const p=Math.round(Number(price));if(!isFinite(p)||p<300)return{ok:false,err:'价格无效'};mo.price=p;return{ok:true};}
function setProd(G,id,q){

function setMktW(G,id,w){

}
function setPromo(G,id,on){const mo=G.models.find(m=>m.id===id);if(!mo||mo.status!=='sale')return{ok:false};mo.promo=!!on;return{ok:true};}
function discontinue(G,id){
  const mo=G.models.find(m=>m.id===id);if(!mo||mo.status==='dead')return{ok:false};

}
function buyCapacity(G,i){
  const up=CAPACITY_UPS[i];if(!up)return{ok:false};
  if(G.cash<up.cost)return{ok:false,err:'资金不足'};

}
function buySlot(G){
  const up=RND_SLOTS[G.slotBought];if(!up)return{ok:false,err:'已满'};

}
function borrow(G,amt){amt=Math.round(Number(amt)||0);if(amt<=0)return{ok:false};if(G.debt+amt>BAL.loanLimit)return{ok:false,err:'超出授信额度'};G.debt+=amt;G.cash+=amt;return{ok:true};}
function repay(G,amt){amt=Math.min(Math.round(Number(amt)||0),G.debt,G.cash);if(amt<=0)return{ok:false};G.debt-=amt;G.cash-=amt;return{ok:true};}
/* ---------- AI ---------- */
function swAI(year){return clamp(20+(year-2010)*2.8,20,100);}
function aiBuild(G,ai,seg){
  const q=ai.style.quality*(DIFFS[G.diff].aiQ+1)+(G.aiAdapt||0);
  const target=expectation(seg,G.year)*q*rnd(0.97,1.04);
  const spec={};let cost=BAL.asmCost,hid=0;
  for(const cat of CAT_KEYS){
    const ts=CATS[cat].tiers;let bi=0,bd=1e9;
    for(let i=0;i<ts.length;i++){
      if(!tierAvail(G,cat,i))continue;
      const d=Math.abs(ts[i].score-target);
      if(d<bd){bd=d;bi=i;}
    }
    spec[cat]=bi;cost+=effCost(G,cat,bi);
    if(ts[bi].hidden)hid++;
  }
  /* 按厂商档次配特色功能：高端厂商 2 个、均衡 1 个、性价比/营销 0-1 个（只用已普及的公开功能） */
  const feats=[];
  const nF=ai.style.quality>=1.03?2:(ai.style.quality>=0.98?1:0);
  const pool=FEATS.filter(f=>!f.hidden&&f.year+2<=G.year).sort((a,b)=>b.score-a.score);
  for(let i=0;i<nF&&i<pool.length;i++){feats.push(pool[i].id);const f=pool[i];cost+=f.cost*Math.pow(BAL.costDecay,G.year-f.year);}
  cost*=rnd(1.0,1.06);
  /* 定价锚定自身部件成本（与玩家同逻辑），段位只做温和上限——边界通胀不再凭空抬高 AI 毛利 */
  let price=cost*(1+ai.style.margin)*modV(G,'aiPrice');
  const bnd=segBounds(seg,G.year);
  if(seg!==SEGS[3])price=Math.min(price,bnd.max*1.25); // 非旗舰最多略超段上限
  price=clamp(price,cost*(1+ai.style.margin),Math.max(cost*2.5,bnd.max*1.25));
  if(price>=1000)price=Math.round(price/100)*100-1;
  const total=(function(){
    let num=0,den=0;
    for(const cat of CAT_KEYS){const w=segW(seg,cat,G.year);num+=w*CATS[cat].tiers[spec[cat]].score;den+=w;}
    const wf=segW(seg,'feat',G.year);
    num+=wf*(featScoreSum(feats)+10);den+=wf;
    return num/den*BAL.hwSwSplit[0]+swAI(G.year)*BAL.hwSwSplit[1];
  })();
  const name=ai.name+' '+String(G.year).slice(2)+pick(['X','Pro','Note','Ace','Max','SE'])+Math.floor(rnd(1,9));
  const mo={name,seg:seg.id,score:total,price,cost,mkt:0,launchMi:G.mi,age:0,totalSales:0};
  const expAll=expectation(seg,G.year)*BAL.hwSwSplit[0]+swAI(G.year)*BAL.hwSwSplit[1];
  yearBestCand(G,{mi:G.mi,name,ratio10:ratioTo10(total/expAll),isPlayer:false,aiName:ai.name});
  ai.models=ai.models.filter(m=>m.seg!==seg.id);ai.models.push(mo);
  return mo;
}
function aiValueMeds(G,seg){
  const vals=[];
  for(const ai of G.ai)for(const m of ai.models)if(m.seg===seg.id&&!ai.broke)vals.push(m.score/Math.pow(m.price,seg.pExp||0.62));
  vals.sort((a,b)=>a-b);
  return vals;
}
function aiSurpriseLaunch(G){
  const alive=G.ai.filter(a=>!a.broke);if(!alive.length)return;
  const ai=pick(alive);
  const seg=segById(pick(ai.style.segs));
  const mo=aiBuild(G,ai,seg);mo.score*=1.08;
  news(G,'突发：'+ai.name+' 发布「'+mo.name+'」，来势汹汹。','badn');
}
/* ---------- 需求与销售：国内(55%)+海外(45% 三区域)多池，softmax 分配 ---------- */
function poolSell(G,cands,size,total,region){
  if(!cands.length||size<=0)return;
  const utils=cands.map(c=>{
    const age=c.kind==='P'?(c.mo.age||0):(G.mi-c.mo.launchMi);
    let ageF=0.55+0.45*Math.exp(-age/BAL.ageHalf);
    if(c.kind==='P'&&c.mo.hypeUntil>G.mi)ageF*=BAL.hypeBoost;
    const repF=0.6+0.4*(c.who.rep/100);
    const m=c.mo.mkt/1e4; // 万元
    const mktF=(1+(subPerk(G,'mkt')?0.75:0.5)*m/(m+3000))*(1+staffBonus(G,'mkt')); // 营销人才强化
    let u=c.sc/Math.pow(c.mo.price,c.seg.pExp||0.62)*repF*mktF*ageF;
    if(c.kind==='P'){
      u*=modV(G,'sales');
      if(c.mo.promo)u*=BAL.promoU; // 促销：需求拉动的代价是让利
      if(c.ovs&&G.ovs.factory)u*=1.15; // 海外本地化建厂，当地好感加成
    }
    return Math.max(u,0.02);
  });
  const mx=Math.max(...utils);
  const exps=utils.map(u=>Math.exp((u-mx)*BAL.softmaxK));
  const sum=exps.reduce((a,b)=>a+b,0);
  const caps=exps.map((_,i)=>cands[i].kind==='P'?BAL.shareCap:BAL.aiShareCap);
  const rawShares=exps.map(e=>e/sum); // 注意不要与外层 segShares 的 shares 同名（TDZ）
  for(let round=0;round<4;round++){ // 封顶截断的需求按未封顶者权重再分配，不再凭空蒸发
    let over=0;const free=[];
    rawShares.forEach((s,i)=>{if(s>caps[i]){over+=s-caps[i];rawShares[i]=caps[i];}else free.push(i);});
    if(over<=1e-9||!free.length)break;
    const fsum=free.reduce((a,i)=>a+rawShares[i],0);
    if(fsum<=1e-12)break;
    free.forEach(i=>rawShares[i]+=over*rawShares[i]/fsum);
  }
  cands.forEach((c,i)=>{
    const demand=size*rawShares[i];
    if(c.kind==='P'){
      const sold=Math.min(demand,c.mo.inv);
      c.mo.inv-=sold;
      const rev=sold*c.mo.price*(c.mo.promo?BAL.promoP:1); // 促销让利
      c.mo.lastSales=(c.mo.lastSales||0)+sold;
      c.mo.totalSales+=sold;
      c.mo.lastRev=(c.mo.lastRev||0)+rev;         // 双池增量累加（月度汇总在 marketMonth 外统一算成本）
      c.mo.cumProfit+=rev-sold*unitCostOf(c.mo);  // 按本池销量扣成本，不重复
      c.who.units+=sold;c.who.rev+=rev;
      if(region)total.ovs=(total.ovs||0)+sold; // 海外销量追踪
      total.sold+=sold;
    }else{
      c.mo.totalSales+=demand;
      c.who.units+=demand;c.who.rev+=demand*c.mo.price;c.who.cogs+=demand*c.mo.cost;
      total.sold+=demand;
    }
  });
}
function marketMonth(G){
  const growth=Math.pow(BAL.marketGrowth,G.year-BAL.startYear);
  const season=SEASONAL[G.month]||1;
  const salesMod=modV(G,'sales');
  const evUnits=G.ev&&G.ev.phase==='mass'?(G.ev.lastUnits||0):0;
  const demandMod=modV(G,'demand')*(1+Math.min(1,evUnits/20000)*0.08); // 造车生态反哺
  const board=G.ai.map(a=>({name:a.name,units:0,rev:0,cogs:0,broke:a.broke,acq:a.acquired,cumProfit:a.cumProfit,who:'ai',ref:a,rep:a.rep}));
  board.push({name:G.coName,units:0,rev:0,cogs:0,broke:false,cumProfit:G.cumProfit,who:'P',rep:G.rep});
  const P=board[board.length-1];
  for(const mo of G.models)if(mo.status==='sale'){mo.lastSales=0;mo.lastRev=0;} // 双池累加前清零当月值
  const shares=segShares(G.year);
  const total={sold:0};
  let marketSize=0,totalSold=0;
    for(const mo of G.models)if(mo.status==='sale'){mo._seg=phoneSeg(G,mo);if(typeof mo.age!=='number')mo.age=0;mo.age=G.mi-mo.launchMi;} // 归段+机龄（结算前）
    const rawSizes=SEGS.map((sg,ix)=>shares[ix]*Math.pow(sg.gRate||1,G.year-BAL.startYear));
  const rawSum=rawSizes.reduce((a,b)=>a+b,0);
  const norm=1/rawSum; // 成熟度曲线：总量守恒，结构随年代漂移
  SEGS.forEach((seg,si)=>{
      const segSeason=1+(season-1)*(seg.amp||1); // 大促对低价位刺激更大
    let size=BAL.marketBase*growth*shares[si]*norm*Math.pow(seg.gRate||1,G.year-BAL.startYear)*segSeason*demandMod;
    if(subPerk(G,'prem')&&(seg.id==='high'||seg.id==='flag'))size*=1.06; // 高端品牌运营
    const cam=camActive(G);
    if(cam&&cam.demand)size*=cam.demand; // 富士胶片色彩年轻粉
    marketSize+=size;
    const allCands=[];
    for(const mo of G.models)if(mo.status==='sale'&&mo._seg===seg)allCands.push({who:P,mo,kind:'P',seg,sc:totalScoreOf(G,mo.spec,mo.feats,seg)});
    G.ai.forEach((ai,i)=>{if(!ai.broke&&!ai.acquired)for(const m of ai.models)if(m.seg===seg.id)allCands.push({who:board[i],mo:m,kind:'AI',seg,sc:m.score});});
    if(!allCands.length)return;
    poolSell(G,allCands,size*0.55,total,null); // 国内池：全厂商
    const ovsSize=size*0.45;
    for(const rg of OVS_REGIONS){
      const openP=rg.id==='sea'||(rg.id==='eu'&&G.ovs.eu)||(rg.id==='me'&&G.ovs.me);
      if(!openP)continue;
      poolSell(G,allCands,ovsSize*rg.share*(G.ovs.factory?1.15:1),total,rg.id);
    }
  });
  totalSold=total.sold;
  G.lastOvs=total.ovs||0;
  for(const b of board)b.share=totalSold>0?b.units/totalSold:0;
  G.board=board;
  return{marketSize,totalSold};
}
/* ---------- 月度推进 ---------- */
function advanceMonth(G){
  if(G.gameOver)return;
  G.mi++;G.month++;if(G.month>12){G.month=1;G.year++;}
  if(G.month===1){
    G.yearStartMi=G.mi;
    // 年度经营报告：汇总上一年
    const yr=G.year-1;
    const fys=(G.fin||[]).filter(f=>f.mi>=G.mi-13&&f.mi<G.mi);
    const yrProfit=fys.reduce((a,f)=>a+f.profit,0);
    const yrUnits=G.hist.filter(h=>h.mi>=G.mi-13&&h.mi<G.mi).reduce((a,h)=>a+(h.units||0),0);
    const avgShare=(()=>{const hs=G.hist.filter(h=>h.mi>=G.mi-13&&h.mi<G.mi);return hs.length?hs.reduce((a,h)=>a+h.share,0)/hs.length:0;})();
    const king=G.news.find(n=>n.txt.includes('年度机皇'));
    // 行业整合：AI 之间也会互相并购（存活 AI ≥3 家时每年 15% 概率）
    const alive=G.ai.filter(a=>!a.broke&&!a.acquired);
    if(alive.length>=3&&Math.random()<0.15){
      const pair=[...alive].sort((x,y)=>y.cumProfit-x.cumProfit); // 强并弱
      const [a1,a2]=pair;
      a1.style={...a1.style,quality:Math.min(1.18,a1.style.quality+0.04)};
      a1.rep=clamp(a1.rep+8,5,100);a1.cash+=Math.max(0,a2.cash);
      a2.broke=true;a2.acquired=true;a2.models=[];a2.rebornMi=0;
      news(G,'🏗 行业整合：「'+a1.name+'」并购「'+a2.name+'」，一个更强的对手诞生了（质量 +0.04）。','badn');
    }
    // 年度对手情报
    for(const ai of alive.slice(0,2)){
      const nxt=ai.models[0]?ai.models[0].name:'新机';
      news(G,'📰 情报：'+ai.name+' 现金 '+fmtMoney(ai.cash)+'，据传下一代「'+nxt.replace(/\d+$/,'系列')+'」正在打磨中。','evt');
    }
    if(avgShare>=0.35&&G.aiAdapt<0.15){G.aiAdapt=Math.min(0.15,(G.aiAdapt||0)+0.03);G.news.unshift({mi:G.mi,y:G.year,m:G.month,txt:'⚠️ 对手们感受到了你的统治力，全行业集体加速研发！（AI 质量 +0.03，累计 +'+G.aiAdapt.toFixed(2)+'）',kind:'badn'});}
    else if(avgShare<0.08&&G.aiAdapt>-0.10){G.aiAdapt=Math.max(-0.10,(G.aiAdapt||0)-0.03);G.news.unshift({mi:G.mi,y:G.year,m:G.month,txt:'😌 你在沉睡，对手开始松懈。（AI 质量 -0.03，累计 '+G.aiAdapt.toFixed(2)+'）',kind:'good'});}
    G.yearReport={yr,profit:yrProfit,units:yrUnits,share:avgShare,
      king:king?king.txt.replace('📺 年度机皇评选：',''):'',
      achievements:(G.achievements||[]).length,
      subs:(G.subsidiaries||[]).length,
      hidden:(G.revealedH||[]).length,
      unlocked:TECHS.filter(t=>t.minYear===yr).length};
    G.showReport=true;
  }
  G.mods=G.mods.filter(m=>m.until===undefined||m.until>G.mi);
  if(G.pendingChoice&&G.mi>G.pendingChoice.mi+1){ // 犹豫超时：管理层代为执行不花钱的方案
    const ev=EVENTS.find(e=>e.id===G.pendingChoice.id);
    const optIdx=ev&&ev.choices?ev.choices.length-1:0;
    const res=resolveChoice(G,optIdx);
    news(G,'（犹豫超时，管理层代为决策：'+((ev&&ev.choices[optIdx])||{}).label+'）','evt');
  }
  if(G.pendingChoice&&G.mi===G.pendingChoice.mi+1&&!G.pendingChoice.warned){
    G.pendingChoice.warned=true;
    const ev=EVENTS.find(e=>e.id===G.pendingChoice.id);
    news(G,'⏳ 「'+(ev?ev.name:'事件')+'」还在等你决策，本月内不决定将按保守方案执行。','evt');
  }
  /* 自动化运营：排产/营销/续约 */
  autoOps(G);
  /* 事件 */
  rollEvent(G);
  /* 研发进度 */
  for(const r of G.techRun.slice()){
    r.left-=(1+staffBonus(G,'rnd')); // 研发型人才加速
    if(r.left<=0){
      G.techRun=G.techRun.filter(x=>x!==r);
      G.techDone[r.id]=true;
      const t=techById(r.id);
      if(t&&t.hidden){news(G,'超前科技突破：'+t.name+'！产业链已经就绪。','tech');
        if(t.id==='ht_satcom'){const e=EVENTS.find(x=>x.id==='yyaol');if(e&&(!e.need||e.need(G)))e.eff(G);} // 遥遥领先彩蛋
      }
      else news(G,'研发完成：'+(t?t.name:r.id),'tech');
    }
  }
  /* 隐藏科技揭示 */
  for(const h of HIDDEN){
    if(!G.revealedH.includes(h.id)&&h.cond(G)){
      G.revealedH.push(h.id);
      news(G,'实验室传来惊人发现——「'+h.name+'」立项可行！研发清单已更新。','tech');
    }
  }
  /* 机型研发进度 */
  for(const mo of G.models){
    if(mo.status==='dev'){
      mo.devLeft--;
      if(mo.devLeft<=0){mo.status='ready';news(G,'「'+mo.name+'」研发完毕，等待发布定价。','good');}
    }
  }
  /* 生产 */
  let capLeft=G.capacity*modV(G,'prodCap');
  const saleModels=G.models.filter(m=>m.status==='sale');
  let prodSpend=0;
  for(const mo of saleModels){
    const q=Math.min(mo.prodPlan,capLeft);
    if(q<=0){mo.prodPlan=0;continue;}
    const cost=q/mo.yield_*mo.bom;
    prodSpend+=cost;mo.inv+=q;capLeft-=q; // 现金在月末随 profit 统一结算，此处只记账
    mo.yield_=Math.min(BAL.yieldMax,mo.yield_+BAL.yieldLearn*(subPerk(G,'bal')?2:1));
  }
  /* AI 决策 */
  for(const ai of G.ai){
    if(ai.acquired)continue; // 子公司退出市场经营
    if(ai.broke){
      if(G.mi>=ai.rebornMi&&ai.rebornMi>0){
        ai.broke=false;ai.name=AI_NAMES.find(n=>!G.ai.some(a=>a.name===n))||ai.name+'二代';
        ai.style=pick(AI_STYLES);ai.cash=6e8*DIFFS[G.diff].aiCash;ai.rep=35;ai.cumProfit=0;ai.models=[];
        news(G,'新玩家入场：「'+ai.name+'」带着新资本杀入市场（'+ai.style.style+'）。','evt');
      }else continue;
    }
    for(const m of ai.models){m.age=G.mi-m.launchMi;m.prevTotal=m.totalSales;}
    for(const sid of ai.style.segs){
      const seg=segById(sid);
      const cur=ai.models.find(m=>m.seg===sid);
      const exp=expectation(seg,G.year);
      if(!cur||cur.age>12+rnd(-2,5)||cur.score<exp*0.88)aiBuild(G,ai,seg);
    }
    ai.rep=clamp(ai.rep+((45+ai.style.quality*18)-ai.rep)*0.04,5,100);
  }
  /* 市场销售 */
  const{marketSize,totalSold}=marketMonth(G);
  /* 财务 */
  let mktSpend=0,invValue=0,invCnt=0;
  for(const mo of G.models){
    if(mo.status!=='sale'){mo.lastSales=0;mo.lastRev=0;continue;}
    mktSpend+=mo.mkt;
    invValue+=mo.inv*unitCostOf(mo);invCnt+=mo.inv;
  }
  const rndBurn=G.techRun.reduce((a,r)=>{const t=techById(r.id);return a+(t?t.cost*1e4/r.total:0);},0);
  const revenue=G.board[G.board.length-1].rev;
  const usersAdd=G.models.reduce((a,m)=>a+(m.lastSales||0),0)*0.85;
  G.users=(G.users+usersAdd)*0.995;
  const arpu=(0.25+(G.year-2010)*0.05)*(G.techDone['sw_store']?1:0);
  const svcRev=G.users*arpu*svcMult(G);
  for(const s of (G.subsidiaries||[])){ // 子公司营收随市场逐月增长，月上缴 = 当前月收入 × 8%
    s.rev=(s.rev||0)*Math.pow(BAL.marketGrowth,1/12);
  }
  const subRev=(G.subsidiaries||[]).reduce((a,s)=>a+(s.rev||0)*0.08,0);
  let evProfit=0;
  if(G.ev.phase==='build'){ // 造车建设期：每月烧 5000 万
    evProfit=-5e7;G.ev.cum-=5e7;
    if(G.mi-G.ev.sinceBuild>=24){
      G.ev.phase='mass';G.ev.sinceMass=G.mi;
      if(!G.ev.models.length)G.ev.models.push({seg:'sedan',segName:'轿车',price:2.19e5,cost:1.2e5,sales:0,cum:0});
      news(G,'🚗 量产车正式交付！首月交付 6000 辆，产能逐月爬坡，「人-车-家」生态开始反哺手机需求。','good');
    }
  }else if(G.ev.phase==='mass'){
    const cap=EV_FACTORY[G.ev.factory-1].cap;
    const demand=Math.min(cap,6000+2200*(G.mi-G.ev.sinceMass));
    let total=0;
    if(G.ev.models.length){
      const ws=G.ev.models.map(m=>1/Math.pow(m.price,0.5)); // 价格效用分摊
      const wsum=ws.reduce((a,b)=>a+b,0);
      G.ev.models.forEach((m,i)=>{
        const u=demand*ws[i]/wsum;
        m.sales=u;m.cum+=u*(m.price-m.cost);
        evProfit+=u*(m.price-m.cost);total+=u;
      });
      G.ev.cum+=evProfit;
    }
    G.ev.lastUnits=total;
    if(total>=30000&&!G.ev.evAch){G.ev.evAch=true;news(G,'🚗 汽车月交付突破 3 万辆大关，第二增长曲线成型！','good');}
  }
  const aiProfit=aiBizRevenue(G)*0.35+wearMonthly(G); // AI 计算卡 + 生态硬件毛利
  const overhead=BAL.overheadBase+BAL.overheadPerLine*G.capacity+BAL.overheadPerModel*saleModels.length;
  const overdraft=G.cash<0?-G.cash:0;
  const interest=G.debt*BAL.loanRate+overdraft*BAL.loanRate;
  const invHold=invValue*BAL.invHoldPct;
  const profit=revenue+svcRev+subRev+evProfit+aiProfit-prodSpend-rndBurn-mktSpend-overhead-interest-invHold;
  G.cash+=profit+rndBurn; // 研发费立项时已预付，摊销只进损益不重复扣现金（修复双扣）
  G.cumProfit+=profit;
  if(G.cash<-BAL.bankruptDebt){G.gameOver='broke';}
  else if(overdraft>1e7&&G.mi%3===0)news(G,'现金透支 '+fmtMoney(overdraft)+'，银行按月收透支利息，抓紧回款或借款。','badn');
  let repTarget=G.revEwma>0?clamp(G.revEwma,5,100):BAL.repBase; // 口碑缓慢向真实产品力漂移
  if(camActive(G))repTarget+=3; // 影像联名提升品牌调性
  G.rep=clamp(G.rep+(repTarget-G.rep)*0.03,5,100);
  G.hist.push({mi:G.mi,cash:G.cash,debt:G.debt,profit,share:G.board[G.board.length-1].share,units:G.board[G.board.length-1].units});
  if(G.hist.length>40)G.hist.shift();
  /* 终局判定 */
  if(!G.gameOver&&!G.sandbox){
    if(G.year>BAL.endYear||(G.year===BAL.endYear&&G.month===12)){
      G.gameOver='win';G.finalGrade=finalGrade(G);
    }
  }
  /* 对手破产 */
  checkAchievements(G);
  checkTutorial(G);
  /* 年度机皇评选：每年 12 月结算，当年发布机型中综合表现最高者口碑 +4 */
  if(G.month===12&&G.yearBest&&typeof G.yearStartMi==='number'&&G.yearBest.mi>=G.yearStartMi){
    if(G.yearBest.isPlayer){G.rep=clamp(G.rep+4,5,100);news(G,'📺 年度机皇评选：「'+G.yearBest.name+'」（我们的！）当选年度最佳机型，口碑 +4','good');}
    else{const w=G.ai.find(a=>a.name===G.yearBest.aiName);if(w)w.rep=clamp(w.rep+4,5,100);news(G,'📺 年度机皇评选：「'+G.yearBest.name+'」（'+G.yearBest.aiName+'）当选年度最佳，明年再战。','badn');}
  }
  if(G.month===12)G.yearBest=null;
  for(const ai of G.ai){
    if(!ai.broke&&ai.cash<-5e8){
      ai.broke=true;ai.rebornMi=G.mi+6;ai.models=[];
      news(G,'震惊业界：「'+ai.name+'」资金链断裂退出市场！','evt');
    }
  }
  /* AI 财务：现金紧张时进入过冬收缩（砍研发与营销），避免集体失血 */
  G.ai.forEach((ai,i)=>{
    if(ai.broke||ai.acquired)return;
    const b=G.board[i];
    ai.lastRev=b.rev;
    const austerity=ai.cash<5e8;
    const mktPct=austerity?Math.min(ai.style.mktPct,0.06):ai.style.mktPct;
    const cogs=b.cogs*1.02;
    const mkt=b.rev*mktPct;
    const rnd=b.rev*(austerity?0.04:Math.min(0.12,ai.style.margin*0.4));
    const oh=(3e6+1.2e6*ai.models.length)*Math.min(4,1+(G.year-BAL.startYear)*0.35);
    const secondCurve=(G.year>=2028&&ai.style.quality>=0.97)?(G.year-2027)*4e7*ai.style.quality:0; // 对手也在造车/做AI卡（纯利口径）
    const aiProfit=b.rev-cogs-mkt-rnd-oh+secondCurve;
    ai.cash+=aiProfit;ai.cumProfit+=aiProfit;
    if(ai.cash>4e9)ai.cash=4e9; // 分红上限，防止现金雪球
    ai.models.forEach(m=>{m.mkt=b.rev*mktPct/Math.max(1,ai.models.length);});
  });
  G.fin.push({mi:G.mi,rev:revenue,svc:svcRev,sub:subRev,ev:evProfit,ai:aiProfit,prod:prodSpend,rnd:rndBurn,mkt:mktSpend,oh:overhead,interest,hold:invHold,profit});
  if(G.fin.length>24)G.fin.shift();
  return{profit,revenue,svcRev,subRev,evProfit,marketSize,totalSold};
}
function rollEvent(G){
  const d=DIFFS[G.diff];
  if(Math.random()>BAL.evtProb*d.evt)return;
  const pass=(e)=>!(G.recentEv&&G.recentEv[e.id]&&G.mi-G.recentEv[e.id]<4)&&!(e.minY&&G.year<e.minY)&&!(e.need&&!e.need(G));
  let ev=null;
  const cps=EVENTS.filter(e=>e.choices&&pass(e));
  if(cps.length&&Math.random()<0.35)ev=pick(cps); // 抉择事件独立通道，保证戏剧性频率
  if(!ev){
    const pool=EVENTS.filter(e=>!e.choices&&pass(e));
    if(!pool.length)return;
    const tw=pool.reduce((a,e)=>a+e.w,0);
    let r=Math.random()*tw;
    for(const e of pool){r-=e.w;if(r<=0){ev=e;break;}}
    if(!ev)ev=pool[0];
  }
  G.recentEv=G.recentEv||{};G.recentEv[ev.id]=G.mi;
  if(ev.choices){ // 抉择事件：挂起等待玩家决策
    G.pendingChoice={id:ev.id,mi:G.mi};
    news(G,'【抉择】'+ev.name+'：'+ev.txt,ev.kind);
    return;
  }
  news(G,'【事件】'+ev.name+'：'+ev.txt,ev.kind); // 先播报，结果文案才能追加到本条
  if(ev.mods){const until=ev.dur?G.mi+ev.dur:undefined;G.mods.push({id:ev.id,until,e:ev.mods});}
  if(ev.eff)ev.eff(G);
}
function resolveChoice(G,optIdx){
  if(!G.pendingChoice)return null;
  const ev=EVENTS.find(e=>e.id===G.pendingChoice.id);
  if(!ev){G.pendingChoice=null;return null;}
  G.pendingChoice=null;
  const res=ev.apply(G,optIdx);
  news(G,'【抉择·'+ev.name+'】'+res,optIdx===ev.choices.length-1?'evt':'evt');
  return res;
}
function yearBestCand(G,cand){
  if(!G.yearBest||cand.ratio10>G.yearBest.ratio10)G.yearBest=cand;
}
function finalGrade(G){
  const h12=G.hist.slice(-12);
  const share12=h12.length?h12.reduce((a,h)=>a+h.share,0)/h12.length:0;
  const hid=G.revealedH.length;
  const achN=(G.achievements||[]).length;
  const pts=clamp(share12*220,0,30)+clamp(G.cumProfit/1e8*1.2,-10,30)+clamp(G.rep*0.18,0,18)+clamp(hid*3.5,0,14)+clamp(achN*2,0,12)+8;
  const g=pts>=92?'S':pts>=78?'A':pts>=60?'B':pts>=40?'C':'D';
  return{pts:Math.round(pts),grade:g,share12};
}
/* ---------- 成就 ---------- */
function checkAchievements(G){
  if(!Array.isArray(G.achievements))G.achievements=[];
  for(const a of ACHIEVEMENTS){
    if(G.achievements.includes(a.id))continue;
    let ok=false;
    try{ok=a.cond(G);}catch(e){}
    if(ok){G.achievements.push(a.id);news(G,'🏆 成就解锁【'+a.name+'】：'+a.desc,'good');}
  }
}
/* ---------- 新手任务清单（前 12 个月）---------- */
const TUTORIAL_STEPS=[
  {id:'research', txt:'在「研发」页启动第一个研究项目（软件或硬件都行）', done:g=>g.techRun.length>0||Object.keys(g.techDone).length>0},
  {id:'design',   txt:'在「设计新机」页按价位段一键配置，点「立项开发」',   done:g=>g.models.some(m=>m.status==='dev'||m.status==='ready'||m.status==='sale')},
  {id:'launch',   txt:'研发完成后在「产品线」为机型定价发布',             done:g=>g.models.some(m=>m.status==='sale')},
  {id:'produce',  txt:'为在售机型安排产量（或开启自动化排产）',           done:g=>g.models.some(m=>m.status==='sale'&&(m.prodPlan>0||(m.lastSales||0)>0))},
  {id:'profit',   txt:'实现单月盈利（月报里净利润为正）',                done:g=>(g.fin||[]).some(f=>f.profit>0)},
  {id:'auto',     txt:'试试总览页的「自动化运营」开关，把琐事托管给 AI',  done:g=>Object.keys(g.techDone).length>0&&(g.mi>=2)},
];
function checkTutorial(G){
  if(!Array.isArray(G.tutorialDone))G.tutorialDone=[];
  if(G.tutorialDone.length>=TUTORIAL_STEPS.length)return;
  for(const s of TUTORIAL_STEPS){
    if(G.tutorialDone.includes(s.id))continue;
    let ok=false;try{ok=s.done(G);}catch(e){}
    if(ok){
      G.tutorialDone.push(s.id);
      const bonus=Math.round(2e7*(G.tutorialDone.length));
      G.cash+=bonus;
      news(G,'📋 新手任务完成【'+s.txt+'】，董事会奖励 '+fmtMoney(bonus)+'（'+G.tutorialDone.length+'/'+TUTORIAL_STEPS.length+'）','good');
    }
  }
}
/* ---------- 存档（主档 + 双份自动轮换备份，防覆盖事故）---------- */
const SAVE_KEY='phoneTycoonSaveV1';
function saveGame(G){
  try{
    if(typeof localStorage==='undefined')return;
    const cur=localStorage.getItem(SAVE_KEY);
    const next=JSON.stringify(G,(k,v)=>k==='ref'||k==='_seg'?undefined:v); // 存档瘦身：剔除回引与临时归段
    if(cur&&cur!==next){ // 内容有变才轮换，保留上上个版本可回退
      const b1=localStorage.getItem(SAVE_KEY+'#bak1');
      if(b1)localStorage.setItem(SAVE_KEY+'#bak2',b1);
      localStorage.setItem(SAVE_KEY+'#bak1',cur);
    }
    localStorage.setItem(SAVE_KEY,next);
  }catch(e){}
}
function migrateSave(G){
  /* 老存档迁移：补齐后续版本新增字段，绝不动已有数值 */
  if(!Array.isArray(G.fin))G.fin=[];
  if(!Array.isArray(G.mods))G.mods=[];
  if(!Array.isArray(G.revealedH))G.revealedH=[];
  if(!Array.isArray(G.subsidiaries))G.subsidiaries=[];
  if(!Array.isArray(G.achievements))G.achievements=[];
  if(!Array.isArray(G.tutorialDone))G.tutorialDone=G.mi>12?TUTORIAL_STEPS.map(s=>s.id):[]; // 老档跳过新手期
  if(!G.recentEv)G.recentEv={};
  if(typeof G.sandbox!=='boolean')G.sandbox=false;
  if(typeof G.revEwma!=='number')G.revEwma=0;
  if(typeof G.yearStartMi!=='number')G.yearStartMi=G.mi-(G.month-1)||0; // 回溯到本年 1 月，保证老档当年机皇评选正常
  if(!G.ovs)G.ovs={patent:false,factory:false};
  if(!G.ev)G.ev={phase:'none',sinceBuild:0,sinceMass:0,cum:0};
  if(G.camPartner===undefined)G.camPartner=null;
  if(!G.auto||typeof G.auto!=='object')G.auto={prod:true,mkt:true,renew:true,research:false,gen:false,expand:false};
  ['research','gen','expand'].forEach(k=>{if(typeof G.auto[k]!=='boolean')G.auto[k]=false;});
  if(typeof G.aiAdapt!=='number')G.aiAdapt=0;
  if(!G.wear||typeof G.wear!=='object')G.wear={watch:null,buds:null};
  if(!Array.isArray(G.staff))G.staff=[];
  if(!G.pity||typeof G.pity!=='object')G.pity={legend:0,rare:0};
  if(!G.aiBiz||typeof G.aiBiz!=='object')G.aiBiz={level:0};
  if(typeof G.forecast!=='boolean')G.forecast=false;
  if(typeof G.lastOvs!=='number')G.lastOvs=0;
  if(!G.ovs)G.ovs={patent:false,factory:false,eu:false,me:false};
  if(typeof G.ovs.eu!=='boolean')G.ovs.eu=false;
  if(typeof G.ovs.me!=='boolean')G.ovs.me=false;
  if(!G.ev)G.ev={phase:'none',sinceBuild:0,sinceMass:0,cum:0};
  if(typeof G.ev.factory!=='number')G.ev.factory=1;
  if(!Array.isArray(G.ev.models))G.ev.models=[];
  /* 存档时目标还是 2030 年且已胜局/临界的，延长跑道继续经营 */
  if(G.gameOver==='win'){
    G.gameOver=null;G.finalGrade=null;G.sandbox=false;
    G.news.unshift({mi:G.mi,y:G.year,m:G.month,txt:'行业进入新纪元：前沿科技井喷，目标年限延长至 '+BAL.endYear+' 年底，继续你的传奇！',kind:'evt'});
  }
  return G;
}
function loadGame(){
  try{
    if(typeof localStorage==='undefined')return null;
    for(const k of [SAVE_KEY,SAVE_KEY+'#bak1',SAVE_KEY+'#bak2']){ // 主档坏了/丢了自动回退备份
      const s=localStorage.getItem(k);
      if(!s)continue;
      try{
        const G=JSON.parse(s);
        if(!G||!G.coName)continue;
        return migrateSave(G);
      }catch(e){continue;}
    }
    return null;
  }catch(e){return null;}
}
function clearSave(){try{if(typeof localStorage!=='undefined'){localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SAVE_KEY+'#bak1');localStorage.removeItem(SAVE_KEY+'#bak2');}}catch(e){}}
/* ================= UI 层 ================= */
let G=null, curTab='ov', D=null; // D = 设计草稿
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr=G=>G.year+' 年 '+G.month+' 月';
/* ---------- 开局界面 ---------- */
function renderBoot(){
  const saved=loadGame();
  $('#boot').style.display='block';$('#app').style.display='none';
  let h=`<div class="card"><h2 style="font-size:22px">📱 手机大亨 <span class="dim" style="font-size:13px">Phone Tycoon</span></h2>
  <p class="dim" style="margin:6px 0">2010 年，智能手机浪潮刚刚掀起。你带着一笔资金入场：搭配硬件、打磨软件、定好价格，
  和四家风格迥异的厂商抢市场。研发看不见的「超前科技」，在 ${BAL.endYear} 年底之前成为行业之王——或者烧光最后一分钱。</p></div>
  <div class="card"><h3>公司名称</h3><input id="boot-name" style="width:260px" maxlength="12" value="星辰科技">
  <h3 style="margin-top:14px">难度</h3><div class="row" id="boot-diff">`;
  for(const k in DIFFS){const d=DIFFS[k];h+=`<div class="opt${k==='normal'?' on':''}" data-k="${k}"><b>${d.label}</b><br><span class="small">${d.desc}</span></div>`;}
  h+=`</div><div class="row" style="margin-top:18px"><button class="pri" style="font-size:16px;padding:10px 30px" onclick="startNew()">开始创业</button>`;
  if(saved)h+=`<button onclick="continueGame()">继续上次（${esc(saved.coName)} · ${saved.year}年${saved.month}月）</button>`;
  if(saved)h+=`<button onclick="exportSave()">📤 导出存档</button>`;
  h+=`<button onclick="importSave()">📥 导入存档</button><button onclick="showHelp()">玩法说明</button></div>
  <p class="small" style="margin-top:10px">存档自动保留最近两份历史版本（防覆盖），重要进度建议定期「导出存档」存到别处。</p></div>`;
  $('#boot').innerHTML=h;
  document.querySelectorAll('#boot-diff .opt').forEach(el=>el.onclick=()=>{
    document.querySelectorAll('#boot-diff .opt').forEach(x=>x.classList.remove('on'));
    el.classList.add('on');
  });
}
let bootDiff='normal';
function startNew(){
  bootDiff=document.querySelector('#boot-diff .on').dataset.k;
  const name=($('#boot-name').value||'星辰科技').trim().slice(0,12);
  // 误触保护：旧档链轮换进备份（可从 bak1 找回），不再一 clear 三灭
  const cur=localStorage.getItem(SAVE_KEY);
  if(cur){const b1=localStorage.getItem(SAVE_KEY+'#bak1');if(b1)localStorage.setItem(SAVE_KEY+'#bak2',b1);localStorage.setItem(SAVE_KEY+'#bak1',cur);localStorage.removeItem(SAVE_KEY);}
  G=newGame(name,bootDiff);D=null;curTab='ov';
  enterApp();showHelp(true);
}
function continueGame(){G=loadGame();if(!G){renderBoot();return;}D=null;curTab='ov';enterApp();}
function enterApp(){$('#boot').style.display='none';$('#app').style.display='block';renderAll();}
/* ---------- 框架渲染 ---------- */
const TABS=[['ov','总览'],['tech','研发'],['design','设计新机'],['prod','产品线'],['mkt','市场'],['strat','战略'],['fin','财务']];
function renderAll(){renderTop();renderTabs();renderView();}
function renderTop(){
  const b=G.board[G.board.length-1];
  const share=b&&b.share?((b.share*100).toFixed(1)+'%'):'0%';
  $('#topbar').innerHTML=`<span class="logo">📱 ${esc(G.coName)}</span>
  <span class="stat">📅 <b>${dateStr(G)}</b></span>
  <span class="stat">💰 <b class="${G.cash<2e7?'neg':''}">${fmtMoney(G.cash)}</b>${G.debt>0?' <span class="neg">欠债 '+fmtMoney(G.debt)+'</span>':''}</span>
  <span class="stat">📊 份额 <b>${share}</b></span>
  <span class="stat">⭐ 口碑 <b>${G.rep.toFixed(0)}</b>/100</span>
  <span class="stat">🏭 月产能 <b>${(G.capacity/10000).toFixed(0)} 万</b></span>
  ${G.sandbox?'<span class="stat acc2">♾ 无限模式</span>':''}
  <button id="nextbtn" onclick="actNext()">下个月 →</button>`;
}
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="${curTab===k?'on':''}" onclick="setTab('${k}')">${n}</button>`).join('')
  +`<button style="margin-left:auto" onclick="showHelp()">?</button>`;
}
function setTab(t){curTab=t;renderTabs();renderView();}
function renderView(){
  const v=$('#view');
  if(curTab==='ov')v.innerHTML=vhOverview();
  else if(curTab==='tech')v.innerHTML=vhTech();
  else if(curTab==='design'){v.innerHTML=vhDesign();bindDesign();}
  else if(curTab==='prod')v.innerHTML=vhProducts();
  else if(curTab==='mkt')v.innerHTML=vhMarket();
  else if(curTab==='strat')v.innerHTML=vhStrat();
  else if(curTab==='fin')v.innerHTML=vhFinance();
  v.querySelectorAll('canvas.chart').forEach(c=>drawCashChart(c));
}
/* ---------- 总览 ---------- */
function vhOverview(){
  const last=G.hist[G.hist.length-1];
  const b=G.board[G.board.length-1];
  const myModels=G.models.filter(m=>m.status==='sale');
  const units=myModels.reduce((a,m)=>a+(m.lastSales||0),0);
  const svcOn=G.techDone['sw_store'];
  let h='';
  if(G.showReport&&G.yearReport){
    const r=G.yearReport;G.showReport=false;
    h+=`<div class="card" style="margin-bottom:12px;border-color:#7a5a22"><h2 class="gold">📊 ${r.yr} 年度经营报告</h2>
    <table><tr><td class="dim">全年销量</td><td class="num mono">${Math.round(r.units).toLocaleString()} 台</td></tr>
    <tr><td class="dim">全年净利润</td><td class="num mono ${r.profit>=0?'pos':'neg'}">${fmtMoney(r.profit)}</td></tr>
    <tr><td class="dim">平均市场份额</td><td class="num mono">${(r.share*100).toFixed(1)}%</td></tr>
    <tr><td class="dim">年度机皇</td><td class="small">${esc(r.king||'未评选')}</td></tr>
    <tr><td class="dim">累计成就/子公司/超前科技</td><td class="num mono">${r.achievements} / ${r.subs} / ${r.hidden}</td></tr></table>
    <div class="small" style="margin-top:6px">${r.yr+1} 年新解锁硬件：${TECHS.filter(t=>t.minYear===r.yr+1).map(t=>t.name.replace('研发：','')).join('、')||'暂无——行业处于平台期'}。</div></div>`;
  }
  if(G.pendingChoice){const ev=EVENTS.find(e=>e.id===G.pendingChoice.id);
    if(ev)h+=`<div class="card" style="margin-bottom:12px;border-color:#8a4444"><h2 class="neg">⚖️ 待决策：${ev.name}</h2><p>${esc(ev.txt)}</p><div class="row">${ev.choices.map((c,i)=>`<button class="pri" onclick="actChooseEv(${i})">${c.label}</button>`).join('')}</div><div class="small dim" style="margin-top:6px">${ev.choices.map(c=>c.label+' — '+c.desc).join('<br>')}</div></div>`;}
  h+=`<div class="row" style="margin-bottom:12px">`;
  h+=kpi('本月销量',units.toLocaleString()+' 台');
  h+=kpi('上月利润',(last?fmtMoney(last.profit):'—'),last&&last.profit<0?'neg':'pos');
  h+=kpi('累计利润',fmtMoney(G.cumProfit),G.cumProfit<0?'neg':'pos');
  h+=kpi('软件分',swScoreOf(G).toFixed(0)+'/100');
  h+=kpi('用户池',(G.users/10000).toFixed(0)+' 万'+(svcOn?'':' <span class=small>(未开通商店)</span>'));
  h+=`</div><div class="card" style="margin-bottom:12px"><b>🤖 自动化运营</b>
  <div class="row" style="margin-top:6px">
  ${[['prod','自动排产'],['mkt','自动营销'],['renew','联名续约']].map(([k,n])=>`<button class="${G.auto[k]?'gold':''}" onclick="actToggleAuto('${k}')">${n} ${G.auto[k]?'开':'关'}</button>`).join('')}
  <span class="small">琐事托管</span></div>
  <div class="row" style="margin-top:4px">
  ${[['research','自动研发'],['gen','自动换代'],['expand','自动扩建']].map(([k,n])=>`<button class="${G.auto[k]?'gold':''}" onclick="actToggleAuto('${k}')">${n} ${G.auto[k]?'开':'关'}</button>`).join('')}
  <span class="small">战略托管（默认关：换代定价/研发方向由你定）</span></div></div>`;
  h+=`<div class="grid" style="grid-template-columns:2fr 1fr">`;
  h+=`<div class="card"><h2>资金曲线</h2><canvas class="chart" width="860" height="180"></canvas>
      <h3>市场份额</h3>${shareBars()}</div>`;
  h+=`<div class="card"><h2>进行中</h2>${projList()}`;
  if((G.tutorialDone||[]).length<TUTORIAL_STEPS.length){
    h+=`<h2 style="margin-top:14px">📋 新手任务（${(G.tutorialDone||[]).length}/${TUTORIAL_STEPS.length}，完成有奖励）</h2>`;
    h+=TUTORIAL_STEPS.map(s=>{
      const done=(G.tutorialDone||[]).includes(s.id);
      return `<div class="row" style="margin:3px 0"><span class="${done?'pos':'dim'}" style="width:20px">${done?'✓':'□'}</span><span class="${done?'small dim':''}" style="flex:1">${s.txt}</span></div>`;
    }).join('');
  }
  const ach=G.achievements||[];
  h+=`<h2 style="margin-top:14px">🏆 成就 ${ach.length}/${ACHIEVEMENTS.length}</h2><div>`;
  h+=ACHIEVEMENTS.map(a=>`<span class="featpick ${ach.includes(a.id)?'on':'dis'}" title="${a.desc}">${ach.includes(a.id)?a.name:'？？？'}</span>`).join('');
  h+=`</div>`;
  h+=`<h2 style="margin-top:14px">动态</h2><div style="max-height:330px;overflow:auto">`;
  h+=G.news.slice(0,30).map(n=>`<div class="news ${n.kind}"><span class="small mono">${n.y}.${String(n.m).padStart(2,'0')}</span> ${esc(n.txt)}</div>`).join('');
  h+=`</div></div></div>`;
  return h;
}
function kpi(label,val,cls){return `<div class="kpi"><span>${label}</span><b class="${cls||''}">${val}</b></div>`;}
function shareBars(){
  const b=G.board;if(!b.length)return '<span class="dim">尚无数据</span>';
  const tot=b.reduce((a,x)=>a+x.units,0);
  return b.slice().sort((x,y)=>y.units-x.units).map(x=>{
    const pct=tot>0?x.units/tot*100:0;
    const me=x.who==='P';
    return `<div class="row" style="margin:4px 0"><span style="width:110px" class="${me?'acc':''}">${me?'◀ ':''}${esc(x.name)}${x.broke?' <span class=neg>(破产)</span>':''}</span>
    <div class="bar thin" style="flex:1"><i style="width:${pct.toFixed(1)}%;${me?'':'opacity:.55'}"></i></div>
    <span class="small mono" style="width:110px;text-align:right">${pct.toFixed(1)}% · ${Math.round(x.units).toLocaleString()}台</span></div>`;
  }).join('');
}
function projList(){
  let h='';
  for(const r of G.techRun){
    const t=techById(r.id);
    h+=`<div class="row" style="margin:4px 0"><span style="flex:1">${esc(t.name)}</span><div class="bar thin" style="width:90px"><i style="width:${((r.total-r.left)/r.total*100).toFixed(0)}%"></i></div><span class="small">${r.left} 月</span></div>`;
  }
  for(const mo of G.models.filter(m=>m.status==='dev')){
    h+=`<div class="row" style="margin:4px 0"><span style="flex:1">📱 ${esc(mo.name)}（研发）</span><div class="bar thin o" style="width:90px"><i style="width:${((3-mo.devLeft)/3*100).toFixed(0)}%"></i></div><span class="small">${mo.devLeft} 月</span></div>`;
  }
  for(const mo of G.models.filter(m=>m.status==='ready')){
    h+=`<div class="row" style="margin:4px 0"><span class="acc2" style="flex:1">📱 ${esc(mo.name)}（待发布！去产品线定价）</span></div>`;
  }
  if(!h)h='<span class="dim">暂无项目。去「研发」点科技，或去「设计新机」立项一台手机。</span>';
  return h;
}
/* ---------- 研发 ---------- */
function techCard(G,t){
  const st=techStatus(G,t);
  const cost=fmtW(t.cost)+' · '+t.months+'个月';
  if(st==='mystery'){
    const h=HIDDEN.find(x=>x.id===t.hid);
    return `<div class="techcard myst"><b>？？？</b><div class="hint">${esc(h?h.hint:'')}</div><div class="sm">满足未知条件后揭晓 · ${cost}</div></div>`;
  }
  const cls=st==='done'?'done':st==='run'?'run':st==='ok'?'':'lock';
  const tag=st==='done'?'<span class="tag">已掌握</span>':st==='run'?'<span class="tag hot">研发中</span>':st==='year'?`<span class="tag">${t.minYear} 年起可研</span>`:st==='req'?'<span class="tag">需前置</span>':'';
  const btn=st==='ok'?`<button style="float:right;margin-top:2px" onclick="actStartTech('${t.id}')">研发</button>`:'';
  return `<div class="techcard ${cls}"><b>${esc(t.name)}${tag}</b><div class="sm">${cost}</div>${btn}</div>`;
}
function vhTech(){
  let h=`<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">`;
  /* 左：软件+特色+隐藏 */
  h+=`<div class="card"><h2>软件工程</h2><div class="small" style="margin-bottom:8px">当前软件分 <b class="acc">${swScoreOf(G).toFixed(0)}</b>/100（计入每台手机总分 28%${G.techDone['sw_store']?'；应用商店已带来持续服务收入':''}）</div>`;
  h+=`<div class="grid" style="grid-template-columns:1fr 1fr">${SW_TECHS.map(t=>techCard(G,t)).join('')}</div>`;
  const hiddenDone=HIDDEN_TECHS.filter(t=>t.hid==='llm');
  h+=`<h2 style="margin-top:14px">超前科技 <span class="small">（满足隐藏条件才会现身）</span></h2><div class="grid" style="grid-template-columns:1fr 1fr">`;
  h+=HIDDEN_TECHS.map(h0=>techCard(G,techById(h0.id))).join('');
  h+=`</div></div>`;
  /* 右：硬件 */
  h+=`<div class="card"><h2>硬件研发 <button style="float:right" onclick="actBuySlot()">扩建研发室（${G.slotBought<RND_SLOTS.length?fmtMoney(RND_SLOTS[G.slotBought].cost)+' / +1 位':'已满'}）</button></h2>
  <div class="small" style="margin-bottom:8px">研发室 ${G.techRun.length}/${G.rndSlots} 位（最多可扩到 ${RND_SLOTS.length+1} 位：${RND_SLOTS.map(r=>fmtMoney(r.cost)).join(' → ')}）。硬件档位需研发解锁并有 2 年独占期——早研发吃肉，晚研发喝汤。</div>`;
  for(const cat of CAT_KEYS){
    const nodes=TECHS.filter(t=>t.cat===cat);
    if(!nodes.length)continue;
    h+=`<h3>${CATS[cat].name}（当前最高可用：${maxTier(G,cat)>=0?CATS[cat].tiers[maxTier(G,cat)].name:'无'}）</h3>`;
    h+=`<div class="grid" style="grid-template-columns:1fr 1fr 1fr">${nodes.map(t=>techCard(G,t)).join('')}</div>`;
  }
  const featNodes=TECHS.filter(t=>t.cat==='feat');
  h+=`<h3>特色功能（整机最多装 3 个）</h3><div class="grid" style="grid-template-columns:1fr 1fr 1fr">${featNodes.map(t=>techCard(G,t)).join('')}</div>`;
  h+=`</div></div>`;
  return h;
}
/* ---------- 设计新机 ---------- */
function draftEnsure(){
  if(!D){
    const spec={};for(const cat of CAT_KEYS)spec[cat]=Math.max(0,maxTier(G,cat));
    D={spec,feats:[],name:'新机 '+ (G.models.length+1)};
  }
  if(D.yearMark!==G.year){D.yearMark=G.year;for(const cat of CAT_KEYS)D.spec[cat]=Math.min(D.spec[cat],Math.max(0,maxTier(G,cat)));}
}
function vhDesign(){
  draftEnsure();
  const bom=bomOf(G,D.spec,D.feats);
  const yc=yield0Of(G,D.spec,D.feats);
  const unit=bom/yc;
  const sug=Math.max(499,Math.round(unit*1.6/100)*100-1);
  const seg=segOfPrice(sug,G.year);
  const total=totalScoreOf(G,D.spec,D.feats,seg);
  const exp=expectation(seg,G.year)*BAL.hwSwSplit[0]+swAI(G.year)*BAL.hwSwSplit[1];
  const estR=clamp(ratioTo10(total/exp)+(swScoreOf(G)>60?0.3:0),1,10);
  const nre=Math.max(8e6,bom*1.8e4);
  const canDev=activeModels(G).length<6;
  let h=`<div class="grid" style="grid-template-columns:3fr 2fr;align-items:start"><div class="card"><h2>配置工台</h2>`;
  h+=`<div class="row" style="margin-bottom:10px">机型名 <input id="d-name" value="${esc(D.name)}" maxlength="10" style="width:150px">
  <span class="small">按价位段一键配置：</span>`;
  for(const s of SEGS)h+=`<button onclick="dAuto('${s.id}')">${s.name}</button>`;
  h+=`</div>`;
  for(const cat of CAT_KEYS){
    h+=`<div class="row" style="margin:6px 0"><span style="width:64px" class="dim">${CATS[cat].name}</span><select style="flex:1" onchange="dSet('${cat}',this.value)">`;
    CATS[cat].tiers.forEach((t,i)=>{
      if(!tierAvail(G,cat,i)){
        if(t.year<=G.year&&!t.hidden)h+=`<option disabled>🔒 ${t.name}（需研发，${t.year+2} 年后公开）</option>`;
        return;
      }
      h+=`<option value="${i}" ${D.spec[cat]===i?'selected':''}>${t.name}（${t.score}分 / 成本约 ¥${Math.round(effCost(G,cat,i))}）</option>`;
    });
    h+=`</select></div>`;
  }
  h+=`<div style="margin-top:8px"><span class="dim">特色功能（${D.feats.length}/3）：</span><br>`;
  for(const f of FEATS){
    const av=featAvail(G,f),on=D.feats.includes(f.id),full=D.feats.length>=3&&!on;
    h+=`<span class="featpick ${on?'on':''} ${!av||full?'dis':''}" onclick="${av&&!full?`dFeat('${f.id}')`:''}">${f.name} +${f.score}</span>`;
  }
  h+=`</div></div>`;
  /* 右：预估 */
  h+=`<div class="card"><h2>立项预估</h2>
  <table>
  <tr><td class="dim">物料成本 BOM</td><td class="num mono">¥${Math.round(bom)}</td></tr>
  <tr><td class="dim">初期良率</td><td class="num mono">${(yc*100).toFixed(0)}%（配置越激进越低，会逐月爬坡）</td></tr>
  <tr><td class="dim">单台综合成本</td><td class="num mono">¥${Math.round(unit)}</td></tr>
  <tr><td class="dim">建议定价</td><td class="num mono acc2">¥${sug}（${seg.name}市场）</td></tr>
  <tr><td class="dim">预估整机分</td><td class="num mono"><b>${total.toFixed(1)}</b>（硬件 ${hwScoreOf(G,D.spec,D.feats,seg).toFixed(1)} + 软件 ${swScoreOf(G).toFixed(1)}）</td></tr>
  <tr><td class="dim">${seg.name}市场当前期望分</td><td class="num mono">${exp.toFixed(1)}（越高越卷）</td></tr>
  <tr><td class="dim">预估媒体评分</td><td class="num mono"><b class="${estR>=7?'pos':estR>=5?'acc2':'neg'}">${estR.toFixed(1)}</b> / 10</td></tr>
  <tr><td class="dim">立项费用（NRE）</td><td class="num mono">${fmtMoney(nre)}</td></tr>
  </table>
  <h3>各价位段行业期望分（${G.year} 年，边界随行业逐年上移）</h3>
  <table>${SEGS.map(s=>{
    const sh=segShares(G.year)[SEGS.indexOf(s)]*100;
    const e=expectation(s,G.year);
    const b=segBounds(s,G.year);
    const range=s.id==='flag'?('≥ '+fmtMoney(b.min)):(fmtMoney(b.min)+' ~ '+fmtMoney(b.max));
    return `<tr><td>${s.name}</td><td class="num mono small">${range}</td><td class="num mono">期望 ${e.toFixed(1)}</td><td class="num mono dim">需求 ${sh.toFixed(0)}%</td></tr>`;
  }).join('')}</table>
  <div class="small" style="margin:8px 0">立项后研发 3 个月，之后在「产品线」发布定价。评分 = 整机分 ÷ 当年行业期望，堆料不如早占坑。</div>
  <button class="pri" style="width:100%;padding:10px" ${canDev?'':'disabled'} onclick="actStartDev()">${canDev?'立 项 开 发':'产品线已满（6 款）'}</button>
  <button style="width:100%;margin-top:6px" onclick="dReset()">重置为当前可用最高配</button>
  </div></div>`;
  return h;
}
function bindDesign(){
  const el=$('#d-name');
  if(el)el.oninput=()=>{D.name=el.value;};
}
function dSet(cat,i){D.spec[cat]=Number(i);renderView();}
function dFeat(id){const i=D.feats.indexOf(id);if(i>=0)D.feats.splice(i,1);else if(D.feats.length<3)D.feats.push(id);renderView();}
function dReset(){D=null;renderView();}
function dAuto(sid){
  const seg=segById(sid);
  const spec={};for(const cat of CAT_KEYS)spec[cat]=0;
  const feats=[];
  let bom=BAL.asmCost;
  for(const cat of CAT_KEYS)bom+=effCost(G,cat,0);
  const bnd=segBounds(seg,G.year);
  const target=seg===SEGS[3]?1.4e4*priceLevel(G.year):((bnd.min+Math.min(bnd.max,bnd.min*1.8))/2)/1.55;
  let improved=true;
  while(improved){
    improved=false;
    let best=null,bestR=0;
    for(const cat of CAT_KEYS){
      const ni=spec[cat]+1;
      if(ni>=CATS[cat].tiers.length||!tierAvail(G,cat,ni))continue;
      const d=effCost(G,cat,ni)-effCost(G,cat,spec[cat]);
      const r=(CATS[cat].tiers[ni].score-CATS[cat].tiers[spec[cat]].score)*segW(seg,cat,G.year)/Math.max(1,d);
      if(d>0&&bom+d<=target&&r>bestR){bestR=r;best={cat,ni,d};}
    }
    // 特色功能也参与性价比竞争
    for(const f of FEATS){
      if(feats.length>=3||!featAvail(G,f)||feats.includes(f.id))continue;
      const d=f.cost*Math.pow(BAL.costDecay,G.year-f.year);
      const r=f.score*segW(seg,'feat',G.year)/Math.max(1,d);
      if(bom+d<=target&&r>bestR){bestR=r;best={feat:f.id,d};}
    }
    if(best){bom+=best.d;if(best.feat)feats.push(best.feat);else spec[best.cat]=best.ni;improved=true;}
  }
  D={spec,feats,name:seg.name+'机 '+(G.models.length+1),yearMark:G.year};
  renderView();
}

/* ---------- 图表 ---------- */
function drawCashChart(cv){
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const hs=G.hist;if(hs.length<2)return;
  const vals=hs.map(h=>h.cash-h.debt);
  const mx=Math.max(...vals,1e7),mn=Math.min(...vals,-1e6);
  ctx.strokeStyle='#2a3648';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.beginPath();
  vals.forEach((v,i)=>{
    const x=i/(vals.length-1)*(W-20)+10;
    const y=H-14-(v-mn)/(mx-mn)*(H-28);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle='#8fa0b8';ctx.font='11px sans-serif';
  ctx.fillText('净值 '+fmtMoney(vals[vals.length-1]),8,14);
}

function showModal(html){$('#modal-root').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){$('#modal-root').innerHTML='';}
/* ---------- 存档导入导出 ---------- */
function exportSave(){
  const s=localStorage.getItem(SAVE_KEY)||localStorage.getItem(SAVE_KEY+'#bak1')||'';
  if(!s){alert('没有可导出的存档');return;}
  showModal(`<h2>📤 导出存档</h2>
  <p class="small">全选复制下面这段文本，保存到记事本/聊天窗口/网盘。下次任何时候用「导入存档」即可恢复。</p>
  <textarea id="exp-box" style="width:100%;height:220px;font-size:11px;word-break:break-all" readonly>${esc(s)}</textarea>
  <div style="text-align:right;margin-top:8px"><button class="pri" onclick="copyExp()">复制</button> <button onclick="closeModal()">关闭</button></div>`);
}
function copyExp(){
  const t=$('#exp-box');t.select();
  try{document.execCommand('copy');alert('已复制到剪贴板');}catch(e){alert('请手动 Ctrl+C 复制');}
}
function importSave(){
  showModal(`<h2>📥 导入存档</h2>
  <p class="small">粘贴之前导出的存档文本。当前存档会先自动转入备份，可随时退回。</p>
  <textarea id="imp-box" style="width:100%;height:220px;font-size:11px;word-break:break-all" placeholder="粘贴存档 JSON"></textarea>
  <div style="text-align:right;margin-top:8px"><button class="pri" onclick="doImport()">确认导入</button> <button onclick="closeModal()">取消</button></div>`);
}
function doImport(){
  const s=$('#imp-box').value.trim();
  let g=null;
  try{
    g=JSON.parse(s);
    if(!g||!g.coName||!Array.isArray(g.models))throw new Error('不是本游戏的存档');
  }catch(e){alert('导入失败：'+e.message);return;}
  const cur=localStorage.getItem(SAVE_KEY);
  if(cur){localStorage.setItem(SAVE_KEY+'#bak1',cur);} // 旧主档转备份
  localStorage.setItem(SAVE_KEY,JSON.stringify(g));
  closeModal();renderBoot();
  alert('导入成功：'+g.coName+' · '+g.year+'年'+g.month+'月');
}
/* ---------- 调试命令（控制台使用，README 有说明）---------- */
window.phoneTycoon={
  jumpTo(y,m){ // 快进到指定年月；途中终局自动切无限模式
    if(!G)return'先开始/继续一局';
    m=m||1;let n=0;
    while(n<600&&(G.year<y||(G.year===y&&G.month<m))){
      advanceMonth(G);n++;
      if(G.gameOver==='win'){G.gameOver=null;G.sandbox=true;}
      if(G.gameOver==='broke')return'破产于 '+G.year+'/'+G.month;
    }
    saveGame(G);renderAll();return G.year+'/'+G.month;
  },
  cash(n){if(!G)return'先开始/继续一局';G.cash=Number(n)||0;saveGame(G);renderAll();return fmtMoney(G.cash);},
};
/* ---------- 启动 ---------- */
renderBoot();
</script>
